name: Flutter checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Generate Android and web platform folders
        run: flutter create . --platforms=android,web

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build web app
        run: flutter build web --release

      - name: Build Android APK
        run: flutter build apk --debug

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: netlify-music-web
          path: build/web/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: netlify-music-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Generate Windows platform folder
        run: flutter create . --platforms=windows

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath netlify-music-windows.zip

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: netlify-music-windows
          path: netlify-music-windows.zip
          if-no-files-found: error
          retention-days: 14

  apple-builds:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Generate iOS and macOS platform folders
        run: flutter create . --platforms=ios,macos

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS app (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app netlify-music-ios-unsigned.zip

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: netlify-music-ios-unsigned
          path: netlify-music-ios-unsigned.zip
          if-no-files-found: error
          retention-days: 14

      - name: Build macOS app
        run: flutter build macos --release

      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/netlify_music.app netlify-music-macos.zip

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: netlify-music-macos
          path: netlify-music-macos.zip
          if-no-files-found: error
          retention-days: 14

  linux-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Generate Linux platform folder
        run: flutter create . --platforms=linux

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux app
        run: flutter build linux --release

      - name: Package Linux app
        run: tar -czf netlify-music-linux.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux app
        uses: actions/upload-artifact@v4
        with:
          name: netlify-music-linux
          path: netlify-music-linux.tar.gz
          if-no-files-found: error
          retention-days: 14


  publish-release:
    if: ${{ github.event_name != 'pull_request' }}
    needs: [validate, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read app version
        id: app-version
        shell: bash
        run: |
          VERSION="$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -n "$VERSION"

      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: netlify-music-windows
          path: release-assets/windows

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: netlify-music-web
          path: release-assets/web

      - name: Package web build
        run: |
          cd release-assets
          zip -qr netlify-music-web.zip web

      - name: Publish latest app release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}
          name: Netlify Music v${{ steps.app-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
          body: |
            Netlify Music release v${{ steps.app-version.outputs.version }}.

            Windows package and web build are provided here. Android signed updates will be enabled after a permanent app-signing key is configured.
          files: |
            release-assets/windows/netlify-music-windows.zip
            release-assets/netlify-music-web.zip
